{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - TechTrend Hub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
        }
        .custom-navbar {
            background: linear-gradient(135deg, #bdd0f3, #3e2a98); /* blue to purple-ish */
        }
        footer {
            background: linear-gradient(135deg, #3e2a98, #bdd0f3); /* blue to purple-ish */
            color: white;
            padding: 20px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}" style="color: #3e2a98; font-weight: bold ;">TechTrend Hub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active " href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{% url 'shop' %}">Shop</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{% url 'cart' %}">Cart</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{% url 'contact' %}">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="content">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Shopping Cart</h2>
        <table class="table table-bordered text-center">
            <thead class="table-dark">
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cart-items"></tbody>
        </table>
        <h4 class="text-end mt-3">Grand Total: $<span id="grand-total">0.00</span></h4>
        <div class="text-end d-flex justify-content-end gap-3 mt-2">
            <button class="btn btn-danger" onclick="clearCart()">Clear Cart</button>
            <a href="{% url 'buy' %}" class="btn btn-success" onclick="saveGrandTotal()">Proceed to Pay</a>


        </div>
        
    </div>
    </div>


    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2025 TechTrend Hub. All rights reserved.</p>
    </footer>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let cartItemsContainer = document.getElementById("cart-items");
            let grandTotal = 0;
            
            cartItemsContainer.innerHTML = ""; // Clear existing items
            
            cart.forEach((item, index) => {
                let total = item.price * item.quantity;
                grandTotal += total;
                
                cartItemsContainer.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>$${item.price.toFixed(2)}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="updateQuantity(${index}, 'decrease')">-</button>
                            ${item.quantity}
                            <button class="btn btn-sm btn-primary" onclick="updateQuantity(${index}, 'increase')">+</button>
                        </td>
                        <td>$${total.toFixed(2)}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">Remove</button></td>
                    </tr>
                `;
            });

            document.getElementById("grand-total").textContent = grandTotal.toFixed(2);
        }

        function updateQuantity(index, action) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            
            if (action === "increase") {
                cart[index].quantity += 1;
            } else if (action === "decrease") {
                cart[index].quantity -= 1;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
            }

            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
        }

        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
        }

        function clearCart() {
            localStorage.removeItem("cart");
            loadCart();
        }

        window.onload = loadCart;
    </script><script>
    function loadCart() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let cartItemsContainer = document.getElementById("cart-items");
        let grandTotal = 0;

        console.log("Loaded Cart Data:", cart); // Debugging line

        cartItemsContainer.innerHTML = ""; // Clear existing items

        if (cart.length === 0) {
            cartItemsContainer.innerHTML = "<tr><td colspan='5'>Your cart is empty.</td></tr>";
        }

        cart.forEach((item, index) => {
            let total = item.price * item.quantity;
            grandTotal += total;

            cartItemsContainer.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>$${item.price.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="updateQuantity(${index}, 'decrease')">-</button>
                        ${item.quantity}
                        <button class="btn btn-sm btn-primary" onclick="updateQuantity(${index}, 'increase')">+</button>
                    </td>
                    <td>$${total.toFixed(2)}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="removeFromCart(${index})">Remove</button></td>
                </tr>
            `;
        });

        document.getElementById("grand-total").textContent = grandTotal.toFixed(2);
    }

    function updateQuantity(index, action) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        if (action === "increase") {
            cart[index].quantity += 1;
        } else if (action === "decrease") {
            cart[index].quantity -= 1;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
    }

    function removeFromCart(index) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
    }

    function clearCart() {
        localStorage.removeItem("cart");
        loadCart();
    }

    // Ensure the function runs when the page loads
    window.onload = loadCart;

    function saveGrandTotal() {
    let grandTotal = document.getElementById("grand-total").textContent;
    localStorage.setItem("grandTotal", grandTotal); // Save the grand total
}
</script>

</body>
</html>
