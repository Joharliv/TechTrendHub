{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - TechTrend Hub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="{% static 'js/script.js' %}"></script>
    
</head>
<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(to right, #f5f7fa, #c3cfe2);
    }
    .card-img-top {
        width: 100%;
        height: 250px; /* Adjust height as needed */
        object-fit: cover; /* Ensures images are cropped consistently */
    }
    footer {
        background: linear-gradient(135deg, #3e2a98, #bdd0f3); /* blue to purple-ish */
        color: white;
        padding: 20px 0;
        position: relative;
        bottom: 0;
        width: 100%;
    }
    .gradient-btn {
        background: linear-gradient(45deg, #9abcfb, #5b46ff); /* Gradient colors */
        border: none;
        color: white;
        font-weight: bold;
        padding: 10px 20px;
        border-radius: 5px;
        transition: all 0.3s ease-in-out;
    }
    .gradient-btn:hover {
    background: linear-gradient(45deg, #FF4500, #FF6347); /* Hover effect */
    transform: scale(1.05);
}
    .custom-navbar {
        background: linear-gradient(135deg, #bdd0f3, #3e2a98); /* blue to purple-ish */
    }
    
</style>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}" style="color: #3e2a98; font-weight: bold ;">TechTrend Hub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{% url 'shop' %}">Shop</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{% url 'about' %}">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{% url 'contact' %}">Contact</a></li>
                    
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">More of Our Products...</h2>
        <div class="row">
            <script>
                const products = [
                    { name: "AI Smartwatch", price: 99.99, image: "{% static 'images/sw.jpeg' %}?v=2" },
                    { name: "Wireless AI Earbuds", price: 59.99, image: "{% static 'images/download (17).jpeg' %}?v=2" },
                    { name: "Smart Home Camera", price: 129.99, image: "{% static 'images/download (18).jpeg' %}?v=2" },
                    { name: "AI-Powered Keyboard", price: 89.99, image: "{% static 'images/download (1).jpeg' %}?v=2" },
                    { name: "Smart Notebook", price: 49.99, image: "{% static 'images/download (2).jpeg' %}?v=2" },
                    { name: "Bluetooth Speaker", price: 79.99, image: "{% static 'images/download (3).jpeg' %}?v=2" },
                    { name: "Smart Ring", price: 199.99, image: "{% static 'images/download (4).jpeg' %}?v=2" },
                    { name: "VR Headset", price: 299.99, image: "{% static 'images/download (5).jpeg' %}?v=2" },
                    { name: "AI Home Assistant", price: 149.99, image: "{% static 'images/download (6).jpeg' %}?v=2" },
                    { name: "Wireless Charging Pad", price: 39.99, image: "{% static 'images/download (7).jpeg' %}?v=2" },
                    { name: "Smart Glasses", price: 249.99, image: "{% static 'images/download (8).jpeg' %}?v=3" },
                    { name: "Portable Projector", price: 349.99, image: "{% static 'images/download (9).jpeg' %}?v=4" },
                    { name: "Smart Lock", price: 159.99, image: "{% static 'images/download (10).jpeg' %}?v=3" },
                    { name: "Noise Cancelling Headphones", price: 199.99, image: "{% static 'images/download (11).jpeg' %}?v=3" },
                    { name: "Fitness Tracker Band", price: 69.99, image: "{% static 'images/download (12).jpeg' %}?v=3" },
                    { name: "Digital Drawing Tablet", price: 229.99, image: "{% static 'images/download (13).jpeg' %}?v=3" },
                    { name: "Smart Thermostat", price: 129.99, image: "{% static 'images/download (14).jpeg' %}?v=4" },
                    { name: "Wireless Mouse", price: 29.99, image: "{% static 'images/download (15).jpeg' %}?v=4" },
                    { name: "Smart Coffee Maker", price: 99.99, image: "{% static 'images/download (16).jpeg' %}?v=4" }
                ];
                function addToCart(name, price) {
            if (name === "AI Smartwatch") {
                window.location.href = "{% url 'product' %}"; // Redirect to product page
            } else {
                let cart = JSON.parse(localStorage.getItem("cart")) || [];
                cart.push({ name, price });
                localStorage.setItem("cart", JSON.stringify(cart));
                alert(`${name} added to cart!`);
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const productContainer = document.querySelector(".row");
            productContainer.innerHTML = products.map(product => `
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow">
                        <img src="${product.image}" class="card-img-top" alt="${product.name}">
                        <div class="card-body text-center">
                            <hr>
                            <h5 class="card-title">${product.name}</h5>
                            <p class="card-text">$${product.price.toFixed(2)}</p>
                            <button class="btn btn-primary gradient-btn" onclick="addToCart('${product.name}', ${product.price})">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `).join('');
        });




    </script>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2025 TechTrend Hub. All rights reserved.</p>
    </footer>
</body>
</html>
